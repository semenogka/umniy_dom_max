<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>Домовой</title>
	</head>
	<body>
		<div id="root"></div>
		<script src="https://st.max.ru/js/max-web-app.js"></script>
		<script>
			// Временная диагностика iOS: ошибки и снимок состояния уходят в access-лог nginx
			(function () {
				function diag(kind, msg) {
					try {
						new Image().src = "/api/__diag?k=" + kind + "&m=" + encodeURIComponent(String(msg).slice(0, 700));
					} catch (e) {}
				}
				addEventListener("error", function (e) {
					diag("error", e.message + " @ " + e.filename + ":" + e.lineno + ":" + e.colno + " " + (e.error && e.error.stack));
				});
				addEventListener("unhandledrejection", function (e) {
					diag("rejection", e.reason && (e.reason.stack || e.reason.message) || e.reason);
				});
				var consoleError = console.error;
				console.error = function () {
					diag("console", Array.prototype.map.call(arguments, function (a) { return a && a.stack || String(a); }).join(" "));
					return consoleError.apply(console, arguments);
				};
				var t0 = Date.now();
				function since() { return (Date.now() - t0) + "ms "; }

				// React планирует работу через MessageChannel: проверяем, доставляется ли он
				var channel = new MessageChannel();
				channel.port1.onmessage = function () { diag("mc", since() + "MessageChannel сработал"); };
				channel.port2.postMessage(null);
				setTimeout(function () { diag("timeout", since() + "setTimeout 0 сработал"); }, 0);

				var origFetch = window.fetch;
				window.fetch = function (input) {
					var url = String(input && input.url || input);
					if (url.indexOf("__diag") < 0) diag("fetch", since() + "start " + url);
					return origFetch.apply(this, arguments).then(function (r) {
						diag("fetch", since() + "end " + r.status + " " + url);
						return r;
					});
				};
				var OrigWS = window.WebSocket;
				window.WebSocket = function (url, p) {
					diag("ws", since() + "new " + url);
					return p === undefined ? new OrigWS(url) : new OrigWS(url, p);
				};
				window.WebSocket.prototype = OrigWS.prototype;
				["CONNECTING", "OPEN", "CLOSING", "CLOSED"].forEach(function (k) { window.WebSocket[k] = OrigWS[k]; });

				setTimeout(function () {
					var s = window.__store && window.__store.getState();
					var st = s ? JSON.stringify({ ui: s.ui, houses: s.houses.status, appeals: s.appeals.status, houseChat: s.houseChat.status, sel: s.houses.selectedHouse && s.houses.selectedHouse.id }) : "no store";
					diag("state", since() + location.href + " | " + st + " | " + document.body.innerText.replace(/\s+/g, " ").slice(0, 120));
				}, 5000);
			})();
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
